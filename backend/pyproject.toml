[project]
name = "leadpulse-backend"
version = "1.0.0"
description = "LeadPulse Lead Generation SaaS — FastAPI Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "gunicorn==22.0.0",
    "pydantic[email]==2.7.4",
    "pydantic-settings==2.3.3",
    "python-dotenv==1.0.1",
    "email-validator==2.1.1",
    "python-multipart==0.0.9",
    "sqlalchemy==2.0.31",
    "alembic==1.13.1",
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.9",
    "redis==5.0.4",
    "celery==5.4.0",
    "structlog==24.1.0",
    "beautifulsoup4==4.12.3",
    "lxml==5.2.2",
    "playwright==1.44.0",
    "tenacity==8.3.0",
    "pandas==2.2.2",
    "openpyxl==3.1.5",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "httpx==0.27.0",
]

# NOTE: The backend is deployed as a Docker container on Render/Railway/Fly.io,
# NOT as a Vercel serverless function. See backend/Dockerfile and render.yaml.
# The [tool.vercel] section has been intentionally removed.