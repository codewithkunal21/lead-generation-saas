# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = migrations

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# sys.path path to be added to sys.path before importing tools
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# timezone =

# max length of characters to prepend to the filename of the migration
# truncate_slug_length = 40

# set to 'true' to run the environment during the
# 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow alembic to search for writing config
# files relative to the current working directory.
# version_locations = %(here)s/bar:%(here)s/bat:migrations/versions

# version path separator; defaults to os.pathsep.
# Use ';' for Windows and ':' for Unix, or 'space' to use spaces.
# version_path_separator = :

# the key used to identify the DB URL in the env.py file.
# We will load this dynamically from our settings/env.
# NOTE: The actual DB URL is loaded dynamically from settings.DATABASE_URL in migrations/env.py.
# This value is overridden at runtime — do NOT hardcode real credentials here.
# For local dev, set DATABASE_URL in backend/.env (Docker Compose service name: db)
# For production, set DATABASE_URL as a managed PostgreSQL URL in Render/Railway/Fly.io.
sqlalchemy.url = postgresql+asyncpg://postgres:change-me@localhost:5432/saas_db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
